uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# RT set=2/binding=0. Vulkanite sorts custom texture sampler names, hence the
# aaa prefix. The atlas contains eight independent 64x64 RG blue-noise tiles.
customTexture.aaaRtBlueNoise = textures/rt_blue_noise_rg_64x64x8.png

# Bloom atlas: one custom image stores L0..L8 using the existing diagonal-strip protocol.
image.bloomBlur = bloomBlur_Sampler rgba rgba32f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba32f float false true 1.0 1.0

