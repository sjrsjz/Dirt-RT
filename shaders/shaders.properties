iris.features.required = SSBO CUSTOM_IMAGES


# Store pure vertex tint in color.rgb (no Minecraft AO pre-multiplied).
# Without this, XHFPTerrainVertex bakes smooth lighting AO into the RGB vertex
# color, so the RT shader's tint multiplication darkens block edges on top of
# the path-traced GI that already handles ambient occlusion itself.
separateAo = true

# For Vulkanite (26.2)
rt.0.dispatch = 1.0 1.0 1
rt.1.dispatch = 1.0 1.0 1
rt.2.dispatch = 1.0 1.0 1
rt.3.dispatch = 1.0 1.0 1
rt.4.dispatch = 1 1 1
rt.5.dispatch = 64 64 64
# ray0 publishes the primary G-buffer. Diffuse/reflection only read it and may
# share a group; refraction writes path roughness and therefore follows them.
rt.groups = 0 1 1 2 3 4


# 1.1 to prevent index out of bound
bufferObject.0 = 112 true 1.1 1.1
bufferObject.1 = 1024
bufferObject.2 = 96 true 1.1 1.1
# Reflection RELAX: five 16-byte tiled virtual images. HISTMETA.zw are reused
# as current-frame endpoint spatial scratch after their history fields expire.
bufferObject.3 = 80 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
# Sparse RC: 6,398,096 uint words (allocator + 4096 bricks × current/RIS/filtered).
bufferObject.5 = 25592384

