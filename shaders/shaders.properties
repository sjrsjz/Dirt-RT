iris.features.required = SSBO CUSTOM_IMAGES


# Store pure vertex tint in color.rgb (no Minecraft AO pre-multiplied).
# Without this, XHFPTerrainVertex bakes smooth lighting AO into the RGB vertex
# color, so the RT shader's tint multiplication darkens block edges on top of
# the path-traced GI that already handles ambient occlusion itself.
separateAo = true

# For Vulkanite (26.2)
rt.0.dispatch = 1.0 1.0 1
rt.1.dispatch = 1.0 1.0 1
rt.2.dispatch = 1.0 1.0 1
rt.3.dispatch = 1 1 1
rt.4.dispatch = 64 64 64
rt.groups = 0 0 0 1 2


# 1.1 to prevent index out of bound
bufferObject.0 = 128 true 1.1 1.1
bufferObject.1 = 1024
bufferObject.2 = 96 true 1.1 1.1
bufferObject.3 = 64 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
# Sparse RC: 4,300,944 uint words (8-chunk XZ radius + map/LRU + 4096 bricks).
bufferObject.5 = 17203776

screen = [RAY_TRACING] [RADIANCE_CACHE] [MATERIAL] [EXPOSURE_DISPLAY] [BLOOM] [TEMPORAL_FILTER] [TEMPORAL_ACCUMULATION] [ATROUS_DENOISER] [DEBUG]
screen.RAY_TRACING = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH PATH_GUIDING_SPECULAR_STRENGTH SUN_PATH_ROTATION END_SKYBOX
screen.RADIANCE_CACHE = RADIANCE_CACHE_MAX_ALLOCATIONS_PER_FRAME RADIANCE_CACHE_RESIDENT_HYSTERESIS_BUCKETS RADIANCE_CACHE_MARK_TILE_SIZE RADIANCE_CACHE_ROUGH_SPECULAR_THRESHOLD RADIANCE_CACHE_DIFFUSE_MIN_BOUNCE
screen.MATERIAL = REFRACTIVE_INDEX MAX_WETNESS POM_ENABLED
screen.EXPOSURE_DISPLAY = DISPLAY_MAX_LUMINANCE DISPLAY_PAPER_WHITE_LUMINANCE EXPOSURE_CURVE_K
screen.BLOOM = BLOOM_MIX
screen.TEMPORAL_FILTER = NRD_BLEND_STRENGTH REFLECT_GGX_CONFIDENCE CURVATURE_CORRECTION_STRENGTH
screen.TEMPORAL_ACCUMULATION = TEMPORAL_MAX_HISTORY TEMPORAL_HISTORY_MIN_WEIGHT TEMPORAL_AABB_ENABLE TEMPORAL_AABB_NEIGHBOR_RADIUS TEMPORAL_AABB_EXPAND TEMPORAL_AABB_SIGMA_SCALE TEMPORAL_AABB_MIN_EXTENT TEMPORAL_AABB_BOX_SCALE TEMPORAL_AABB_MIN_VALID_NEIGHBORS
screen.ATROUS_DENOISER = ATROUS_NORMAL_POWER ATROUS_PHI_L ATROUS_POSITION_PARAM ATROUS_GAMMA
screen.DEBUG = DEBUG_VIEW

sliders = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH PATH_GUIDING_SPECULAR_STRENGTH SUN_PATH_ROTATION RADIANCE_CACHE_MAX_ALLOCATIONS_PER_FRAME RADIANCE_CACHE_RESIDENT_HYSTERESIS_BUCKETS RADIANCE_CACHE_MARK_TILE_SIZE RADIANCE_CACHE_ROUGH_SPECULAR_THRESHOLD RADIANCE_CACHE_DIFFUSE_MIN_BOUNCE REFRACTIVE_INDEX MAX_WETNESS DISPLAY_MAX_LUMINANCE DISPLAY_PAPER_WHITE_LUMINANCE EXPOSURE_CURVE_K BLOOM_MIX NRD_BLEND_STRENGTH REFLECT_GGX_CONFIDENCE CURVATURE_CORRECTION_STRENGTH TEMPORAL_MAX_HISTORY TEMPORAL_HISTORY_MIN_WEIGHT TEMPORAL_AABB_NEIGHBOR_RADIUS TEMPORAL_AABB_EXPAND TEMPORAL_AABB_SIGMA_SCALE TEMPORAL_AABB_MIN_EXTENT TEMPORAL_AABB_BOX_SCALE TEMPORAL_AABB_MIN_VALID_NEIGHBORS ATROUS_NORMAL_POWER ATROUS_PHI_L ATROUS_POSITION_PARAM ATROUS_GAMMA DEBUG_VIEW

uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# 辐射率缓存时域中间体 — z[0,127]/z[128,255] 无损承载两个 packed vec4

# Bloom 图集 — 单张 custom image 存 L0/L1/L2 多级 LOD (右侧条带布局)
image.bloomBlur = bloomBlur_Sampler rgba rgba16f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba16f float false true 1.0 1.0

