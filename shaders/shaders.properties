iris.features.required = SSBO CUSTOM_IMAGES


# Store pure vertex tint in color.rgb (no Minecraft AO pre-multiplied).
# Without this, XHFPTerrainVertex bakes smooth lighting AO into the RGB vertex
# color, so the RT shader's tint multiplication darkens block edges on top of
# the path-traced GI that already handles ambient occlusion itself.
separateAo = true

# For Vulkanite (26.2)
rt.0.dispatch = 1.0 1.0 1
rt.1.dispatch = 1.0 1.0 1
rt.2.dispatch = 1.0 1.0 1
rt.3.dispatch = 1.0 1.0 1
rt.4.dispatch = 1 1 1
rt.5.dispatch = 64 64 64
# ray0 publishes primary geometry and prepared specular history; ray1 publishes
# prepared diffuse history while ray1..ray3 trace the first lobes. Ray4 handles
# cache allocation and publishes FrameData after every full-screen path pass;
# ray5 updates voxels after the following barrier.
rt.groups = 0 1 1 1 2 3


# 1.1 to prevent index out of bound
# Six 16-byte compact geometry/material layers. Primary position is rebuilt
# from octahedral ray + FP32 distance; distance < 0 is also the sky mask.
bufferObject.0 = 96 true 1.1 1.1
bufferObject.1 = 1024
# Diffuse N=0..7: raw/filtered histories, shared reprojected guide and surface.
# Independent-current scratch reuses bloomAtlas/bloomBlur until composite90.
bufferObject.2 = 128 true 1.1 1.1
# Reflection MaxEnt: current MaxEnt, three compact history layers, and one
# dual-use transient layer. Ray0 publishes the shared surface-reprojected
# denoised state there; reflection temporal later reuses it for N0 chroma.
bufferObject.3 = 80 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
# Sparse RC: 6,398,096 uint words (allocator + 4096 bricks × current/RIS/filtered).
bufferObject.5 = 25592384
# Two 16-byte per-pixel diagnostic records. Debug data never aliases renderer
# history or lighting storage, so selecting a view cannot mutate production.
bufferObject.6 = 32 true 1.1 1.1

# ============================================================
# Screen groups & option assignment
# ============================================================
screen = [RAY_TRACING] [MATERIAL] [POM] [RADIANCE_CACHE] [MAXENT_DENOISER] [BLOOM] [EXPOSURE_DISPLAY] [ADVANCED] [DEBUG]

screen.RAY_TRACING = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH SPECULAR_PATH_GUIDING_STRENGTH SUN_PATH_ROTATION END_SKYBOX FIREFLY_SUPPRESSION_MULTIPLIER GI_CLAMP_MAX
screen.MATERIAL = EON_ENABLED REFRACTIVE_INDEX GLASS_REFRACTIVE_INDEX MAX_WETNESS
screen.POM = POM_ENABLED POM_STEPS POM_DEPTH BINARY_SEARCH_STEPS
screen.RADIANCE_CACHE = RADIANCE_CACHE_MAX_ALLOCATIONS_PER_FRAME RADIANCE_CACHE_RESIDENT_HYSTERESIS_BUCKETS RADIANCE_CACHE_MARK_TILE_SIZE RADIANCE_CACHE_ROUGH_SPECULAR_THRESHOLD RADIANCE_CACHE_DIFFUSE_MIN_BOUNCE VOXEL_SIZE RADIANCE_CACHE_MAX_HIST RADIANCE_CACHE_FILTER_MAX_HIST RADIANCE_CACHE_UPDATE_PERIOD RADIANCE_CACHE_RIS_GUIDING_STRENGTH RADIANCE_CACHE_RIS_GUIDING_KAPPA
screen.MAXENT_DENOISER = [MAXENT_TEMPORAL] [MAXENT_VARIANCE] [MAXENT_SPATIAL]
screen.MAXENT_TEMPORAL = MAXENT_TEMPORAL_RESPONSE_DISTANCE_SCALE [MAXENT_DIFFUSE_TEMPORAL] [MAXENT_SPECULAR_TEMPORAL]
screen.MAXENT_DIFFUSE_TEMPORAL = MAXENT_DIFFUSE_TEMPORAL_DEPTH_SCALE MAXENT_DIFFUSE_TEMPORAL_REPROJECTION_RADIUS
screen.MAXENT_SPECULAR_TEMPORAL = MAXENT_SPECULAR_TEMPORAL_DISOCCLUSION_THRESHOLD MAXENT_SPECULAR_TEMPORAL_LOBE_FRACTION MAXENT_SPECULAR_TEMPORAL_REPROJECTION_RADIUS
screen.MAXENT_VARIANCE = MAXENT_VARIANCE_KERNEL_SIGMA MAXENT_VARIANCE_SPATIAL_ONLY_SAMPLES MAXENT_VARIANCE_TRANSITION_SAMPLES
screen.MAXENT_SPATIAL = MAXENT_SPATIAL_PLANE_DISTANCE_TOLERANCE MAXENT_SPATIAL_DIFFUSE_LIGHT_FIELD_SENSITIVITY MAXENT_SPATIAL_SPECULAR_LIGHT_FIELD_SENSITIVITY
screen.BLOOM = CAMERA_VIGNETTE_STRENGTH BLOOM_MIX BLOOM_DIFFUSION_SCALE BLOOM_CHROMATIC_SCATTER
screen.EXPOSURE_DISPLAY = DISPLAY_MAX_LUMINANCE DISPLAY_PAPER_WHITE_LUMINANCE AUTO_EXPOSURE_OUTLIER_TOLERANCE EXPOSURE_CURVE_K PUPIL_MIN_DIAMETER_MM PUPIL_MAX_DIAMETER_MM
screen.ADVANCED = VPROJDIST_SKY
screen.DEBUG = DEBUG_RT_FORCE_GEOMETRY_NORMAL DEBUG_VIEW

# ============================================================
# Sliders
# ============================================================
sliders = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH SPECULAR_PATH_GUIDING_STRENGTH SUN_PATH_ROTATION END_SKYBOX FIREFLY_SUPPRESSION_MULTIPLIER GI_CLAMP_MAX EON_ENABLED REFRACTIVE_INDEX GLASS_REFRACTIVE_INDEX MAX_WETNESS POM_ENABLED POM_STEPS POM_DEPTH BINARY_SEARCH_STEPS RADIANCE_CACHE_MAX_ALLOCATIONS_PER_FRAME RADIANCE_CACHE_RESIDENT_HYSTERESIS_BUCKETS RADIANCE_CACHE_MARK_TILE_SIZE RADIANCE_CACHE_ROUGH_SPECULAR_THRESHOLD RADIANCE_CACHE_DIFFUSE_MIN_BOUNCE VOXEL_SIZE RADIANCE_CACHE_MAX_HIST RADIANCE_CACHE_FILTER_MAX_HIST RADIANCE_CACHE_UPDATE_PERIOD RADIANCE_CACHE_RIS_GUIDING_STRENGTH RADIANCE_CACHE_RIS_GUIDING_KAPPA MAXENT_TEMPORAL_RESPONSE_DISTANCE_SCALE MAXENT_DIFFUSE_TEMPORAL_DEPTH_SCALE MAXENT_DIFFUSE_TEMPORAL_REPROJECTION_RADIUS MAXENT_SPECULAR_TEMPORAL_DISOCCLUSION_THRESHOLD MAXENT_SPECULAR_TEMPORAL_LOBE_FRACTION MAXENT_SPECULAR_TEMPORAL_REPROJECTION_RADIUS MAXENT_SPATIAL_SPECULAR_LIGHT_FIELD_SENSITIVITY MAXENT_VARIANCE_KERNEL_SIGMA MAXENT_VARIANCE_SPATIAL_ONLY_SAMPLES MAXENT_VARIANCE_TRANSITION_SAMPLES MAXENT_SPATIAL_DIFFUSE_LIGHT_FIELD_SENSITIVITY MAXENT_SPATIAL_PLANE_DISTANCE_TOLERANCE CAMERA_VIGNETTE_STRENGTH BLOOM_MIX BLOOM_DIFFUSION_SCALE BLOOM_CHROMATIC_SCATTER DISPLAY_MAX_LUMINANCE DISPLAY_PAPER_WHITE_LUMINANCE AUTO_EXPOSURE_OUTLIER_TOLERANCE EXPOSURE_CURVE_K PUPIL_MIN_DIAMETER_MM PUPIL_MAX_DIAMETER_MM VPROJDIST_SKY DEBUG_VIEW

uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# RT set=2/binding=0. Vulkanite sorts custom texture sampler names, hence the
# aaa prefix. The atlas contains eight independent 64x64 RG blue-noise tiles.
customTexture.aaaRtBlueNoise = textures/rt_blue_noise_rg_64x64x8.png
# Precomputed EON partition coefficients. Raw custom textures default to linear
# filtering and clamp-to-edge in Iris.
customTexture.aabEonKappaLut = textures/eon_kappa_49x33x196.rgba16fraw TEXTURE_3D RGBA16F 49 33 196 RGBA HALF_FLOAT
# Two-fetch continuous qLi Smith--GGX/Fresnel response. It replaces the
# former 16-direction projection in composite lighting.
customTexture.ggxQLiCdfLut = textures/specular_q_li_cdf_33x33x33.rgba16fraw TEXTURE_3D RGBA16F 33 33 33 RGBA HALF_FLOAT

# Bloom atlas: one custom image stores L0..L8 using the existing diagonal-strip protocol.
image.bloomBlur = bloomBlur_Sampler rgba rgba32f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba32f float false true 1.0 1.0

