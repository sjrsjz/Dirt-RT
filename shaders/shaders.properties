iris.features.required = SSBO CUSTOM_IMAGES

# fucking vram blackhole, support up to 2560x1600
# 1.1 to prevent index out of bound
bufferObject.0 = 112 true 1.1 1.1
bufferObject.1 = 1024
bufferObject.2 = 72 true 1.1 1.1
bufferObject.3 = 64 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
bufferObject.5 = 64000000
screen = ACCUMULATION_LENGTH RAY_BOUNCES Refractive_Index maxWetness Sharp_Volumetric_Light Volumetric_Light_Samples ExposureS BLOOM_MIX TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM
sliders = ACCUMULATION_LENGTH RAY_BOUNCES Refractive_Index maxWetness Volumetric_Light_Samples ExposureS BLOOM_MIX TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM
uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# Reflect/refract temporal history now in SSBO (SpecularRTElement.hist_*, 64B/element).
# 8 rgba32f images removed — saves ~253MB VRAM and 8 binding slots.

# Bloom 图集 — 单张 custom image 存 L0/L1/L2 多级 LOD (右侧条带布局)
# imageLoad/imageStore 同 image 不同区域读写合法, 无需 ping-pong, 无 mipmap
image.bloomBlur = bloomBlur_Sampler rgba rgba16f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba16f float false true 1.0 1.0
