iris.features.required = SSBO CUSTOM_IMAGES

# fucking vram blackhole, support up to 2560x1600
# 1.1 to prevent index out of bound
bufferObject.0 = 128 true 1.1 1.1
bufferObject.1 = 512
bufferObject.2 = 80 true 1.1 1.1
bufferObject.3 = 80 true 1.1 1.1
bufferObject.4 = 80 true 1.1 1.1
bufferObject.5 = 64000000
bufferObject.6 = 80 true 1.1 1.1
bufferObject.7 = 96 true 1.1 1.1
bufferObject.8 = 96 true 1.1 1.1

screen = ACCUMULATION_LENGTH RAY_BOUNCES Refractive_Index maxWetness Sharp_Volumetric_Light Volumetric_Light_Samples ExposureS useReSTIR
sliders = ACCUMULATION_LENGTH RAY_BOUNCES Refractive_Index maxWetness Volumetric_Light_Samples ExposureS
uniform.vec2.resolution = vec2(viewWidth, viewHeight)

image.diffuseIllumiantionData_shY = diffuseIllumiantionData_shY_Sampler rgba rgba32f float false true 1.0 1.0
image.diffuseIllumiantionData_CoCg = diffuseIllumiantionData_CoCg_Sampler rg rg32f float false true 1.0 1.0
image.diffuseIllumiantionData_shY_swap = diffuseIllumiantionData_shY_swap_Sampler rgba rgba32f float false true 1.0 1.0
image.diffuseIllumiantionData_CoCg_swap = diffuseIllumiantionData_CoCg_swap_Sampler rgba rgba32f float false true 1.0 1.0
image.diffuseIllumiantionData_lpos = diffuseIllumiantionData_lpos_Sampler rgba rgba32f float false true 1.0 1.0
image.diffuseIllumiantionData_lnormal = diffuseIllumiantionData_lnormal_Sampler rgba rgba32f float false true 1.0 1.0

image.extInfoBuffer = extInfoBuffer_Sampler rgba rgba32f float false true 1.0 1.0


image.reflectIllumiantionData_color = reflectIllumiantionData_color_Sampler rgba rgba32f float false true 1.0 1.0
image.reflectIllumiantionData_swap_color = reflectIllumiantionData_color_swap_Sampler rgba rgba32f float false true 1.0 1.0
image.reflectIllumiantionData_lpos = reflectIllumiantionData_lpos_Sampler rgba rgba32f float false true 1.0 1.0
image.reflectIllumiantionData_lnormal = reflectIllumiantionData_lnormal_Sampler rgba rgba32f float false true 1.0 1.0

image.refractIllumiantionData_color = refractIllumiantionData_color_Sampler rgba rgba32f float false true 1.0 1.0
image.refractIllumiantionData_swap_color = refractIllumiantionData_color_swap_Sampler rgba rgba32f float false true 1.0 1.0
image.refractIllumiantionData_lpos = refractIllumiantionData_lpos_Sampler rgba rgba32f float false true 1.0 1.0
image.refractIllumiantionData_lnormal = refractIllumiantionData_lnormal_Sampler rgba rgba32f float false true 1.0 1.0