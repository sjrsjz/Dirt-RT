iris.features.required = SSBO CUSTOM_IMAGES

# fucking vram blackhole, support up to 2560x1600
# 1.1 to prevent index out of bound
bufferObject.0 = 112 true 1.1 1.1
bufferObject.1 = 1024
bufferObject.2 = 72 true 1.1 1.1
bufferObject.3 = 64 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
bufferObject.5 = 64000000
screen = ACCUMULATION_LENGTH RAY_BOUNCES REFRACTIVE_INDEX MAX_WETNESS SHARP_VOLUMETRIC_LIGHT VOLUMETRIC_LIGHT_SAMPLES EXPOSURE_S BLOOM_MIX TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM ENABLE_GAUSSIAN_FILTER
sliders = ACCUMULATION_LENGTH RAY_BOUNCES REFRACTIVE_INDEX MAX_WETNESS VOLUMETRIC_LIGHT_SAMPLES EXPOSURE_S BLOOM_MIX TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM
uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# Bloom 图集 — 单张 custom image 存 L0/L1/L2 多级 LOD (右侧条带布局)
image.bloomBlur = bloomBlur_Sampler rgba rgba16f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba16f float false true 1.0 1.0
