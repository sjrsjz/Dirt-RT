iris.features.required = SSBO CUSTOM_IMAGES

# fucking vram blackhole, support up to 2560x1600
# 1.1 to prevent index out of bound
bufferObject.0 = 112 true 1.1 1.1
bufferObject.1 = 1024
bufferObject.2 = 72 true 1.1 1.1
bufferObject.3 = 64 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
bufferObject.5 = 64000000

screen = [RAY_TRACING] [MATERIAL] [VOLUMETRIC_LIGHT] [EXPOSURE_DISPLAY] [BLOOM] [TEMPORAL_FILTER] [TEMPORAL_ACCUMULATION] [SVGF_DENOISER] [DEBUG]
screen.RAY_TRACING = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH
screen.MATERIAL = REFRACTIVE_INDEX MAX_WETNESS
screen.VOLUMETRIC_LIGHT = SHARP_VOLUMETRIC_LIGHT VOLUMETRIC_LIGHT_SAMPLES
screen.EXPOSURE_DISPLAY = DISPLAY_MAX_LUMINANCE EXPOSURE_CURVE_K
screen.BLOOM = BLOOM_MIX
screen.TEMPORAL_FILTER = TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM NRD_BLEND_STRENGTH
screen.TEMPORAL_ACCUMULATION = TEMPORAL_MAX_HISTORY TEMPORAL_CONFIDENCE_POWER TEMPORAL_HISTORY_MIN_WEIGHT TEMPORAL_AABB_ENABLE TEMPORAL_AABB_NEIGHBOR_RADIUS TEMPORAL_AABB_EXPAND TEMPORAL_AABB_SIGMA_SCALE TEMPORAL_AABB_MIN_EXTENT TEMPORAL_AABB_BOX_SCALE TEMPORAL_AABB_MIN_VALID_NEIGHBORS
screen.SVGF_DENOISER = VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM ENABLE_GAUSSIAN_FILTER
screen.DEBUG = DEBUG_VIEW

sliders = ACCUMULATION_LENGTH RAY_BOUNCES PATH_GUIDING_STRENGTH REFRACTIVE_INDEX MAX_WETNESS VOLUMETRIC_LIGHT_SAMPLES DISPLAY_MAX_LUMINANCE EXPOSURE_CURVE_K BLOOM_MIX TEMPORAL_NORMAL_PARAM TEMPORAL_POSITION_PARAM NRD_BLEND_STRENGTH TEMPORAL_MAX_HISTORY TEMPORAL_CONFIDENCE_POWER TEMPORAL_HISTORY_MIN_WEIGHT TEMPORAL_AABB_ENABLE TEMPORAL_AABB_NEIGHBOR_RADIUS TEMPORAL_AABB_EXPAND TEMPORAL_AABB_SIGMA_SCALE TEMPORAL_AABB_MIN_EXTENT TEMPORAL_AABB_BOX_SCALE TEMPORAL_AABB_MIN_VALID_NEIGHBORS VAR_FILTER_RADIUS VARIANCE_SCALE SVGF_NORMAL_POWER SVGF_PHI_L SVGF_POSITION_PARAM DEBUG_VIEW

uniform.vec2.resolution = vec2(viewWidth, viewHeight)

# Bloom 图集 — 单张 custom image 存 L0/L1/L2 多级 LOD (右侧条带布局)
image.bloomBlur = bloomBlur_Sampler rgba rgba16f float false true 1.0 1.0
image.bloomAtlas = bloomAtlas_Sampler rgba rgba16f float false true 1.0 1.0

# ============================================================
# Display names
# ============================================================
option.ACCUMULATION_LENGTH = Accumulation Length
option.RAY_BOUNCES = Ray Bounces
option.PATH_GUIDING_STRENGTH = Path Guiding Strength
option.REFRACTIVE_INDEX = Water IOR
option.MAX_WETNESS = Max Wetness
option.SHARP_VOLUMETRIC_LIGHT = Volumetric Light Quality
option.VOLUMETRIC_LIGHT_SAMPLES = Volumetric Light Samples
option.DISPLAY_MAX_LUMINANCE = Display Peak Luminance
option.EXPOSURE_CURVE_K = Exposure Curve
option.BLOOM_MIX = Bloom Strength
option.TEMPORAL_NORMAL_PARAM = History Normal Rejection
option.TEMPORAL_POSITION_PARAM = History Position Rejection
option.NRD_BLEND_STRENGTH = Low-Confidence Blend
option.TEMPORAL_MAX_HISTORY = Max History Frames
option.TEMPORAL_CONFIDENCE_POWER = Confidence Power
option.TEMPORAL_HISTORY_MIN_WEIGHT = Min History Weight
option.TEMPORAL_AABB_ENABLE = AABB Clamp
option.TEMPORAL_AABB_NEIGHBOR_RADIUS = AABB Neighbor Radius
option.TEMPORAL_AABB_EXPAND = AABB Expand
option.TEMPORAL_AABB_SIGMA_SCALE = AABB Sigma Scale
option.TEMPORAL_AABB_MIN_EXTENT = AABB Min Extent
option.TEMPORAL_AABB_BOX_SCALE = AABB Box Scale
option.TEMPORAL_AABB_MIN_VALID_NEIGHBORS = AABB Min Valid Neighbors
option.VAR_FILTER_RADIUS = Variance Filter Radius
option.VARIANCE_SCALE = Variance Scale
option.SVGF_NORMAL_POWER = SVGF Normal Edge Sensitivity
option.SVGF_PHI_L = SVGF Luminance Edge Sensitivity
option.SVGF_POSITION_PARAM = SVGF Depth Edge Sensitivity
option.ENABLE_GAUSSIAN_FILTER = Geometry-Guided Filter
option.DEBUG_VIEW = Debug View
