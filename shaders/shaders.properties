iris.features.required = SSBO CUSTOM_IMAGES


# Store pure vertex tint in color.rgb (no Minecraft AO pre-multiplied).
# Without this, XHFPTerrainVertex bakes smooth lighting AO into the RGB vertex
# color, so the RT shader's tint multiplication darkens block edges on top of
# the path-traced GI that already handles ambient occlusion itself.
separateAo = true

# For Vulkanite (26.2)
rt.0.dispatch = 1.0 1.0 1
rt.1.dispatch = 1.0 1.0 1
rt.2.dispatch = 1.0 1.0 1
rt.3.dispatch = 1.0 1.0 1
rt.4.dispatch = 1.0 1.0 1
rt.5.dispatch = 1.0 1.0 1
rt.6.dispatch = 1 1 1
rt.7.dispatch = 64 64 64
# ray0 publishes the primary G-buffer. Diffuse/reflection only read it and may
# share a group. Refraction now writes only its private PSR metadata and can run
# beside both continuation passes.
# ray4 builds a biased prewarm prior from ray1's cache snapshot; ray5 commits it.
# The cache allocator can share group 3 with that independent commit, while
# ray7 follows it behind a group-4 barrier to update the allocated voxels.
rt.groups = 0 1 1 1 2 3 3 4


# 1.1 to prevent index out of bound
# Six 16-byte compact geometry/material layers. Primary position is rebuilt
# from octahedral ray + FP32 distance; distance < 0 is also the sky mask.
bufferObject.0 = 96 true 1.1 1.1
bufferObject.1 = 1024
# Diffuse N=0..8: denoiser/history, ReSTIR scratch and the transparent-free
# background surface domain used by PSR refraction resolve.
bufferObject.2 = 144 true 1.1 1.1
# Reflection MaxEnt: current MaxEnt plus three compact history layers. The old
# current-position layer was redundant with primary ray and distance.
bufferObject.3 = 64 true 1.1 1.1
bufferObject.4 = 64 true 1.1 1.1
# Sparse RC: 6,398,096 uint words (allocator + 4096 bricks × current/RIS/filtered).
bufferObject.5 = 25592384

